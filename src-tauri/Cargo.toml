[package]
name = "vtubeleaf"
version = "0.1.10"
license = "MIT"
description = "Local Live2D face tracking studio"
edition = "2021"
publish = false

[[bin]]
name = "VTubeLeaf"
path = "src/main.rs"

[lib]
name = "vtubeleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep the WebView inspector available in release builds for troubleshooting.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }
