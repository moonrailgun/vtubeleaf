[package]
name = "vtubeleaf"
version = "1.1.1"
license = "MIT"
description = "Local Live2D face tracking studio"
edition = "2021"
publish = false

[[bin]]
name = "VTubeLeaf"
path = "src/main.rs"

[lib]
name = "vtubeleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep the WebView inspector available in release builds for troubleshooting.
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "time", "sync"] }
sys-locale = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_24"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

# Smaller, faster release binaries. Panics keep unwinding so a failed background task cannot abort the app.
[profile.release]
lto = true
codegen-units = 1
strip = true
