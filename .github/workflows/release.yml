name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version tag
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${version}`, 'Release requires a tag matching package.json');
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${version.split('+')[0].includes('-')}\n`);
          NODE

  checks:
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit

  macos:
    needs: version
    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

  publish:
    needs: [version, checks, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - uses: actions/download-artifact@v8
        with:
          pattern: VTubeLeaf-*
          merge-multiple: true
          path: packages
      - name: Verify packages and publish GitHub Release
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          sha256sum --check SHA256SUMS.txt
          node -e 'const fs = require("node:fs"); const config = require("../src-tauri/tauri.conf.json"); fs.writeFileSync(process.env.RUNNER_TEMP + "/updater.pub", Buffer.from(config.plugins.updater.pubkey, "base64"));'
          for package in ./*.exe ./*.app.tar.gz; do
            base64 --decode "$package.sig" > "$RUNNER_TEMP/updater.sig"
            minisign -V -p "$RUNNER_TEMP/updater.pub" -m "$package" -x "$RUNNER_TEMP/updater.sig"
          done
          gh api "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$RELEASE_TAG" --jq .body > "$RUNNER_TEMP/release-notes.md"
          node ../scripts/create-updater-manifest.mjs . "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
          sha256sum ./*.dmg ./*.zip ./*.exe ./*.app.tar.gz ./*.sig latest.json > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.dmg ./*.zip ./*.exe ./*.app.tar.gz ./*.sig latest.json SHA256SUMS.txt \
            --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          gh release edit "$RELEASE_TAG" --draft=false
  website:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: website-release-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update website release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-website-release.mjs
