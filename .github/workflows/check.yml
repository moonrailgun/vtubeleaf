name: Desktop checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-15
            bundle: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: node scripts/check-macos-release.mjs --self-test
      - run: node scripts/setup-assets.mjs --self-test
      - run: node scripts/setup-openseeface.mjs --self-test
      - run: python tests/openseeface-launcher.test.py
      - run: npm run setup:assets
      - run: npm run setup:assets -- --check
      - run: npm run bundle:openseeface -- --python python
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Verify native macOS icon is bundled
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/release/bundle/macos/VTubeLeaf.app
          test ! -e "$app/Contents/Resources/openseeface"
          test -s "$app/Contents/Resources/Assets.car"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")"
          test -s "$app/Contents/Resources/icon.icns"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Windows camera integration checks (x64 and x86)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($platform in @('x64', 'Win32')) {
            $output = ".local/camera-check/$platform"
            cmake -S native/windows-camera -B $output -A $platform -DBUILD_TESTING=ON
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build $output --config Release --parallel
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            ctest --test-dir $output -C Release --output-on-failure
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
