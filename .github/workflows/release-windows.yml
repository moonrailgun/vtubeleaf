name: Package Windows release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run setup:assets
      - run: npm run setup:assets -- --check
      - run: npm run bundle:openseeface -- --python python
      - run: python tests/openseeface-launcher.test.py
      - name: Validate frozen OpenSeeFace inference
        run: |
          # The pinned RGB sample also works with OpenCV's Windows image backend.
          python scripts/check-openseeface.py .local/openseeface/models/benchmark.bin --executable .local/openseeface-bundle/x86_64/facetracker.exe
      - name: Build Windows release installer
        run: npm run tauri -- build --bundles nsis
      - name: Package independent OpenSeeFace launcher
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $folder = ".local/VTubeLeaf-OpenSeeFace-$version-windows-x64"
          Move-Item .local/openseeface-bundle/x86_64 $folder
          Compress-Archive -Path $folder -DestinationPath "$folder.zip"
      - name: Sign Windows updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          npm run tauri -- signer sign ($installers[0].FullName)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload Windows release installer
        uses: actions/upload-artifact@v7
        with:
          name: VTubeLeaf-windows-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload independent OpenSeeFace package
        uses: actions/upload-artifact@v7
        with:
          name: VTubeLeaf-OpenSeeFace-windows-${{ github.run_number }}
          path: .local/VTubeLeaf-OpenSeeFace-*-windows-x64.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
